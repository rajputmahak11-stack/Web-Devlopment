<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaching Registration</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="bg-primary text-white p-3 text-center fs-4">
Coaching Institute Registration Form
</div>

<div class="container mt-4 mb-5">
<div class="d-flex gap-2">
<label class="w-25">Full Name:</label>
<input type="text" id="fullname" class="form-control">
</div>
<span id="nameError" class="text-danger"></span>

<div class="d-flex gap-2 mt-3">
<label class="w-25">Email:</label>
<input type="text" id="email" class="form-control">
</div>
<span id="emailError" class="text-danger"></span>

<div class="d-flex gap-2 mt-3">
<label class="w-25">Mobile:</label>
<input type="text" id="mobile" class="form-control">
</div>
<span id="mobileError" class="text-danger"></span>


<div class="d-flex gap-2 mt-3">
<label class="w-25">DOB:</label>
<input type="date" id="dob" class="form-control">
</div>
<span id="dobError" class="text-danger"></span>


<div class="d-flex gap-2 mt-3">
<label class="w-25">Qualification:</label>
<select id="qualification" class="form-control">
<option value="">Select</option>
<option>10th</option>
<option>12th</option>
<option>Graduate</option>
<option>Postgraduate</option>
</select>
</div>
<span id="qualError" class="text-danger"></span>


<div class="d-flex gap-2 mt-3">
<label class="w-25">Percentage / Grade:</label>
<input type="text" id="marks" class="form-control">
</div>
<span id="marksError" class="text-danger"></span>


<div class="d-flex gap-2 mt-3">
<label class="w-25">Course:</label>
<select id="course" class="form-control">
<option value="">Select</option>
<option>IIT-JEE</option>
<option>NEET</option>
<option>Banking</option>
<option>UPSC</option>
</select>
</div>
<span id="courseError" class="text-danger"></span>


 <div class="d-flex gap-2 mt-3">
<label class="w-25">Batch Timing:</label>
<select id="batch" class="form-control">
<option value="">Select</option>
<option>Morning</option>
<option>Evening</option>
</select>
</div>
<span id="batchError" class="text-danger"></span>


<div class="d-flex gap-2 mt-3">
<label class="w-25">Address:</label>
<textarea id="address" class="form-control"></textarea>
</div>
<span id="addressError" class="text-danger"></span>


<div class="d-flex gap-2 mt-3">
<label class="w-25">City:</label>
<input type="text" id="city" class="form-control">
</div>
<span id="cityError" class="text-danger"></span>



<div class="d-flex gap-2 mt-3">
<label class="w-25">Pin Code:</label>
<input type="text" id="pincode" class="form-control">
</div>
<span id="pinError" class="text-danger"></span>


<div class="d-flex gap-2 mt-3">
<label class="w-25">Guardian Name:</label>
<input type="text" id="gname" class="form-control">
</div>
<span id="gnameError" class="text-danger"></span>


<div class="d-flex gap-2 mt-3">
<label class="w-25">Guardian Mobile:</label>
<input type="text" id="gmobile" class="form-control">
</div>
<span id="gmobileError" class="text-danger"></span>


<button class="btn btn-primary w-100 mt-4" onclick="register()">Register</button>
</div>
</body>
<script src="script.js"></script>
</html>
