<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tip Calculator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-primary">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow rounded-4">
            <div class="card-body">
              <h4 class="text-center mb-4">Tip Calculator</h4>

              <label class="form-label">Bill Amount (₹)</label>
              <input
                type="number"
                id="bill"
                class="form-control"
                placeholder="Enter bill amount"
              />

              <label class="form-label mt-3">How was the service?</label>
              <select id="service" class="form-select">
                <option value="0">Select</option>
                <option value="0.25">25% - Top Notch</option>
                <option value="0.20">20% - Excellent</option>
                <option value="0.15">15% - Good</option>
                <option value="0.10">10% - Bad</option>
                <option value="0.05">5% - Worst</option>
              </select>

              <label class="form-label mt-3">Number of People</label>
              <input
                type="number"
                id="people"
                class="form-control"
                placeholder="Enter number of people"
              />

              <button
                class="btn btn-primary w-100 mt-4"
                onclick="calculateTip()"
              >
                Calculate
              </button>

              <div id="result" class="alert alert-success mt-4 d-none"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
